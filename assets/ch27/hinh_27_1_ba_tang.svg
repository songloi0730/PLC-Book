<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>Mũi tên chỉ đi XUỐNG. Tầng dưới không gọi ngược lên — nó chỉ công bố trạng thái để tầng trên đọc.</text>
