<text x='42' y='564' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Q1  Chỉ gọi xuống, không gọi lên. Tầng dưới chỉ báo cáo trạng thái qua biến ra của nó.</text>
<text x='42' y='580' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Q2  Ngang hàng không gọi nhau. Trạm 1 không đọc biến nội bộ của trạm 2 — chỉ đọc giao diện đã công bố.</text>
<text x='42' y='596' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Q3  Chỉ tầng cơ cấu được chạm vào ngõ ra vật lý. Nhờ vậy cuộn dây trùng không thể xảy ra.</text>
