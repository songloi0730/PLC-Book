<text x='150' y='324' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#565E66' text-anchor='start'>Đo gì</text>
<text x='392' y='324' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#565E66' text-anchor='start'>Nếu KHÔNG có → nguyên nhân nằm ở đây</text>
<line x1='38' y1='332' x2='878' y2='332' stroke='#9AA3AB' stroke-width='1.2'/>
<circle cx='56' cy='352' r='11' fill='#C0392B'/>
<text x='56' y='356' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>Đ1</text>
<text x='90' y='356' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#1A1D21' text-anchor='start'>Nguồn cấp cảm biến (nâu ↔ xanh dương)</text>
<text x='392' y='356' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Nguồn 24 V hoặc cầu chì nhánh — dừng ở đây, không đo tiếp</text>
<circle cx='56' cy='382' r='11' fill='#C0392B'/>
<text x='56' y='386' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>Đ2</text>
<text x='90' y='386' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#1A1D21' text-anchor='start'>Đen ↔ chân chung module, khi cảm biến kích hoạt</text>
<text x='392' y='386' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Cảm biến hỏng, HOẶC kiểu đấu sai (PNP/NPN — Chương 4)</text>
<circle cx='56' cy='412' r='11' fill='#C0392B'/>
<text x='56' y='416' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>Đ3</text>
<text x='90' y='416' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#1A1D21' text-anchor='start'>Ngay tại cầu đấu vào module</text>
<text x='392' y='416' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Đứt dây hoặc lỏng đầu cốt — đoạn giữa Đ2 và Đ3</text>
<circle cx='56' cy='442' r='11' fill='#2C5F8D'/>
<text x='56' y='446' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>Đ4</text>
<text x='90' y='446' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#1A1D21' text-anchor='start'>Bit trong chương trình (xem trực tuyến)</text>
<text x='392' y='446' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Module hỏng, hoặc kênh chưa được cấu hình</text>
<rect x='24' y='490' width='892' height='52' rx='3' fill='#FDF6E7' stroke='#B8860B' stroke-width='1.2'/>
<text x='42' y='512' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='700' fill='#7A5B08' text-anchor='start'>⚠  Đ2 đo so với CHÂN CHUNG CỦA MODULE, không phải so với 0 V.</text>
<text x='42' y='530' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#7A5B08' text-anchor='start'>Đo so với 0 V sẽ cho kết quả 'có điện áp' ngay cả khi tổ hợp đấu nối sai — bạn sẽ bỏ sót đúng nguyên nhân (Chương 4).</text>
