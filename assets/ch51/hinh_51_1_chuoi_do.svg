<text x='515' y='152' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Module vào</text>
<text x='515' y='170' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.8' font-weight='400' fill='#565E66' text-anchor='middle'>opto + ảnh ngõ vào</text>
<rect x='680' y='126' width='210' height='72' rx='5' fill='#E7EFF6' stroke='#2C5F8D' stroke-width='1.6'/>
