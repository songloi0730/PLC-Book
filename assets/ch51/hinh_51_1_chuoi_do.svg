<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 560' width='940' height='560'>
<rect width='940' height='560' fill='#FFFFFF'/>
<text x='24' y='34' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='16' font-weight='700' fill='#1A1D21' text-anchor='start'>Hình 51.1 — Bốn phép đo tách lỗi trên đường tín hiệu ngõ vào</text>
<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>Đo theo thứ tự Đ1 → Đ4. Mỗi phép đo loại trừ được một đoạn của đường tín hiệu — không cần đoán.</text>
<rect x='40' y='126' width='150' height='72' rx='5' fill='#F4F5F7' stroke='#1A1D21' stroke-width='1.6'/>
<text x='115' y='152' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Cảm biến</text>
<text x='115' y='170' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.8' font-weight='400' fill='#565E66' text-anchor='middle'>PNP, 3 dây</text>
<rect x='250' y='126' width='110' height='72' rx='5' fill='#F4F5F7' stroke='#1A1D21' stroke-width='1.6'/>
<text x='305' y='152' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Cầu đấu</text>
<text x='305' y='170' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.8' font-weight='400' fill='#565E66' text-anchor='middle'>đầu cốt</text>
