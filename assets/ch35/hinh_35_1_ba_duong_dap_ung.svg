<text x='664' y='142' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Dừng DƯỚI điểm đặt và ở lại đó</text>
<line x1='664' y1='174' x2='694' y2='174' stroke='#2E7D4F' stroke-width='3'/>
<text x='702' y='178' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='700' fill='#1A1D21' text-anchor='start'>P + I</text>
<text x='664' y='198' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Tới đúng điểm đặt — I xoá sai lệch</text>
<line x1='664' y1='230' x2='694' y2='230' stroke='#B03A2E' stroke-width='3'/>
<text x='702' y='234' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='700' fill='#1A1D21' text-anchor='start'>P quá lớn</text>
<text x='664' y='254' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Dao động quanh điểm đặt, lâu tắt</text>
<rect x='26' y='356' width='848' height='48' rx='3' fill='#FDF6E7' stroke='#B8860B' stroke-width='1.2'/>
<text x='40' y='376' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#7A5B08' text-anchor='start'>⚠  Sai lệch tĩnh KHÔNG phải lỗi chỉnh định — nó là bản chất của P thuần: hết sai lệch thì hết tín hiệu ra, nên nó phải giữ lại một chút sai lệch để còn ngõ ra.</text>
<text x='40' y='394' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#7A5B08' text-anchor='start'>⭐  Tăng P để bù sai lệch tĩnh sẽ dẫn tới đường màu đỏ. Cách đúng là thêm I — và khi đó phải lo chống bão hoà tích phân (mục 35.5).</text>
</svg>