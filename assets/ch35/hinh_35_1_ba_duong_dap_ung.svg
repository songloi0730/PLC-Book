<text x='24' y='34' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='16' font-weight='700' fill='#1A1D21' text-anchor='start'>Hình 35.1 — Vì sao P thuần luôn để lại sai lệch, và thêm I thì hết</text>
<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>Cùng một quá trình, cùng một điểm đặt. Chỉ khác cách chỉnh — và ba kết quả khác hẳn nhau.</text>
