<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 560' width='940' height='560'>
<rect width='940' height='560' fill='#FFFFFF'/>
<text x='24' y='34' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='16' font-weight='700' fill='#1A1D21' text-anchor='start'>Hình 25.1 — Máy trạng thái chuẩn cho một cỗ máy</text>
<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>Tại mọi thời điểm máy ở ĐÚNG MỘT trạng thái. Đường đỏ: lỗi xảy ra được ở bất cứ đâu, nên mọi trạng thái đều phải có lối vào Alarm.</text>
<rect x='30' y='112' width='152' height='54' rx='7' fill='#F4F5F7' stroke='#1A1D21' stroke-width='1.7'/>
<text x='106' y='136' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Uninitialized</text>
<text x='106' y='153' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='400' fill='#565E66' text-anchor='middle'>vừa cấp nguồn</text>
<rect x='250' y='112' width='152' height='54' rx='7' fill='#F4F5F7' stroke='#1A1D21' stroke-width='1.7'/>
<text x='326' y='136' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Homing</text>
<text x='326' y='153' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='400' fill='#565E66' text-anchor='middle'>đang về gốc</text>
<rect x='470' y='112' width='152' height='54' rx='7' fill='#F4F5F7' stroke='#1A1D21' stroke-width='1.7'/>
<text x='546' y='136' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Idle</text>
<text x='546' y='153' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='400' fill='#565E66' text-anchor='middle'>sẵn sàng, chờ lệnh</text>
<rect x='690' y='112' width='152' height='54' rx='7' fill='#E8F2EC' stroke='#2E7D4F' stroke-width='1.7'/>
<text x='766' y='136' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Running</text>
<text x='766' y='153' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='400' fill='#565E66' text-anchor='middle'>đang chạy chu trình</text>
<rect x='690' y='232' width='152' height='54' rx='7' fill='#F4F5F7' stroke='#1A1D21' stroke-width='1.7'/>
<text x='766' y='256' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Hold</text>
<text x='766' y='273' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='400' fill='#565E66' text-anchor='middle'>dừng, GIỮ nguyên vị trí</text>
<rect x='250' y='384' width='152' height='54' rx='7' fill='#F4F5F7' stroke='#1A1D21' stroke-width='1.7'/>
<text x='326' y='408' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Resetting</text>
<text x='326' y='425' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='400' fill='#565E66' text-anchor='middle'>đang xoá lỗi</text>
<rect x='470' y='384' width='152' height='54' rx='7' fill='#F8E7E4' stroke='#B03A2E' stroke-width='1.7'/>
<text x='546' y='408' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Alarm</text>
<text x='546' y='425' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='400' fill='#565E66' text-anchor='middle'>có lỗi, đã dừng</text>
<line x1='182' y1='139' x2='236' y2='139' stroke='#1A1D21' stroke-width='2'/>
<polygon points='246.0,139.0 236.0,144.0 236.0,134.0' fill='#1A1D21'/>
<text x='216' y='127' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='600' fill='#565E66' text-anchor='middle'>Reset</text>
<line x1='402' y1='139' x2='456' y2='139' stroke='#1A1D21' stroke-width='2'/>
<polygon points='466.0,139.0 456.0,144.0 456.0,134.0' fill='#1A1D21'/>
<text x='436' y='127' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='600' fill='#565E66' text-anchor='middle'>về gốc xong</text>
<line x1='622' y1='139' x2='676' y2='139' stroke='#1A1D21' stroke-width='2'/>
<polygon points='686.0,139.0 676.0,144.0 676.0,134.0' fill='#1A1D21'/>
<text x='656' y='127' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='600' fill='#565E66' text-anchor='middle'>Start</text>
<line x1='734' y1='166' x2='734' y2='218' stroke='#1A1D21' stroke-width='2'/>
<polygon points='734.0,228.0 729.0,218.0 739.0,218.0' fill='#1A1D21'/>
<text x='726' y='203' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='600' fill='#565E66' text-anchor='end'>Hold</text>
<line x1='800' y1='232' x2='800' y2='180' stroke='#1A1D21' stroke-width='2'/>
<polygon points='800.0,170.0 805.0,180.0 795.0,180.0' fill='#1A1D21'/>
<text x='808' y='203' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='600' fill='#565E66' text-anchor='start'>Start</text>
<line x1='766' y1='286' x2='766' y2='310' stroke='#1A1D21' stroke-width='2'/>
<line x1='766' y1='310' x2='380' y2='310' stroke='#1A1D21' stroke-width='2'/>
<line x1='380' y1='310' x2='380' y2='180' stroke='#1A1D21' stroke-width='2'/>
<polygon points='380.0,170.0 385.0,180.0 375.0,180.0' fill='#1A1D21'/>
<text x='573' y='326' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='600' fill='#565E66' text-anchor='middle'>giữ Stop 2 giây → huỷ chu trình, về gốc lại</text>
<line x1='106' y1='166' x2='106' y2='340' stroke='#C0392B' stroke-width='1.5' stroke-dasharray='5,4'/>
<line x1='356' y1='166' x2='356' y2='340' stroke='#C0392B' stroke-width='1.5' stroke-dasharray='5,4'/>
<line x1='806' y1='286' x2='806' y2='340' stroke='#C0392B' stroke-width='1.5' stroke-dasharray='5,4'/>
<line x1='106' y1='340' x2='806' y2='340' stroke='#C0392B' stroke-width='1.8'/>
<line x1='601' y1='340' x2='601' y2='370' stroke='#C0392B' stroke-width='2.4'/>
<polygon points='601.0,380.0 596.0,370.0 606.0,370.0' fill='#C0392B'/>
<text x='818' y='345' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#C0392B' text-anchor='start'>từ MỌI trạng thái</text>
<line x1='466' y1='411' x2='416' y2='411' stroke='#1A1D21' stroke-width='2'/>
<polygon points='406.0,411.0 416.0,406.0 416.0,416.0' fill='#1A1D21'/>
<text x='436' y='374' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='600' fill='#565E66' text-anchor='middle'>Reset (lỗi đã hết)</text>
<line x1='290' y1='384' x2='290' y2='200' stroke='#1A1D21' stroke-width='2'/>
<line x1='290' y1='200' x2='290' y2='180' stroke='#1A1D21' stroke-width='2'/>
<polygon points='290.0,170.0 295.0,180.0 285.0,180.0' fill='#1A1D21'/>
<text x='280' y='218' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='600' fill='#565E66' text-anchor='end'>xoá xong → về gốc lại</text>
<rect x='24' y='486' width='892' height='52' rx='3' fill='#FDF6E7' stroke='#B8860B' stroke-width='1.2'/>
<text x='42' y='508' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='600' fill='#7A5B08' text-anchor='start'>⚠  E-Stop KHÔNG phải một trạng thái ở đây. Nó là mạch cứng cắt nguồn cơ cấu, hoạt động kể cả khi CPU treo.</text>
<text x='42' y='526' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#7A5B08' text-anchor='start'>Máy trạng thái chỉ PHẢN ỨNG với việc E-Stop đã bị nhấn (chuyển sang Alarm), chứ không THỰC HIỆN việc dừng — xem Chương 47.</text>
</svg>