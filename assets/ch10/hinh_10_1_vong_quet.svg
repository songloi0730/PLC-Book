<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 362' width='900' height='362'>
<rect width='900' height='362' fill='#FFFFFF'/>
<text x='24' y='34' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='16' font-weight='700' fill='#1A1D21' text-anchor='start'>Hình 10.1 — Bốn giai đoạn của vòng quét</text>
<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>PLC lặp bốn giai đoạn này mãi mãi. Van chỉ thật sự mở ở giai đoạn 3, không phải lúc chương trình ghi lệnh.</text>
<rect x='30' y='100' width='195' height='110' rx='3' fill='#EAF1F6' stroke='#1A1D21' stroke-width='1.4'/>
<text x='127' y='126' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='13' font-weight='700' fill='#1A1D21' text-anchor='middle'>1. ĐỌC ngõ vào</text>
<text x='127' y='152' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='middle'>chụp ảnh toàn bộ ngõ vào</text>
<text x='127' y='169' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='middle'>vào bộ nhớ một lượt</text>
<line x1='228' y1='155' x2='231' y2='155' stroke='#1A1D21' stroke-width='2'/>
<polygon points='241.0,155.0 231.0,160.0 231.0,150.0' fill='#1A1D21'/>
<rect x='245' y='100' width='195' height='110' rx='3' fill='#F4F5F7' stroke='#1A1D21' stroke-width='1.4'/>
<text x='342' y='126' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='13' font-weight='700' fill='#1A1D21' text-anchor='middle'>2. CHẠY chương trình</text>
<text x='342' y='152' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='middle'>từ trên xuống dưới</text>
<text x='342' y='169' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='middle'>đọc ảnh, ghi ảnh</text>
<line x1='443' y1='155' x2='446' y2='155' stroke='#1A1D21' stroke-width='2'/>
<polygon points='456.0,155.0 446.0,160.0 446.0,150.0' fill='#1A1D21'/>
<rect x='460' y='100' width='195' height='110' rx='3' fill='#EAF1F6' stroke='#1A1D21' stroke-width='1.4'/>
<text x='557' y='126' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='13' font-weight='700' fill='#1A1D21' text-anchor='middle'>3. GHI ngõ ra</text>
<text x='557' y='152' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='middle'>đẩy ảnh ngõ ra</text>
<text x='557' y='169' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='middle'>ra module một lượt</text>
<line x1='658' y1='155' x2='661' y2='155' stroke='#1A1D21' stroke-width='2'/>
<polygon points='671.0,155.0 661.0,160.0 661.0,150.0' fill='#1A1D21'/>
<rect x='675' y='100' width='195' height='110' rx='3' fill='#F4F5F7' stroke='#1A1D21' stroke-width='1.4'/>
<text x='772' y='126' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='13' font-weight='700' fill='#1A1D21' text-anchor='middle'>4. VIỆC hệ thống</text>
<text x='772' y='152' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='middle'>truyền thông, tự chẩn đoán,</text>
<text x='772' y='169' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='middle'>phục vụ phần mềm</text>
<line x1='772' y1='210' x2='772' y2='252' stroke='#1A1D21' stroke-width='2'/>
<line x1='772' y1='252' x2='127' y2='252' stroke='#1A1D21' stroke-width='2'/>
<line x1='127' y1='252' x2='127' y2='225' stroke='#1A1D21' stroke-width='2'/>
<polygon points='127.0,215.0 132.0,225.0 122.0,225.0' fill='#1A1D21'/>
<text x='401' y='243' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#565E66' text-anchor='middle'>lặp lại — mỗi vòng vài mili-giây tới vài chục mili-giây</text>
<rect x='30' y='292' width='840' height='44' rx='3' fill='#FDF6E7' stroke='#B8860B' stroke-width='1.2'/>
<text x='44' y='319' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='400' fill='#7A5B08' text-anchor='start'>⚠  Giữa giai đoạn 1 và giai đoạn 3, dù cảm biến ngoài kia có đổi trạng thái, PLC cũng không biết — nó chỉ nhìn ảnh đã chụp.</text>
</svg>