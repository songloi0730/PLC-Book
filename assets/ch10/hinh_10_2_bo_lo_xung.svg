<text x='24' y='352' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='600' fill='#1A1D21' text-anchor='start'>Điều kiện chắc chắn bắt được:  xung  >  thời gian quét  +  thời gian lọc ngõ vào   (thực hành lấy hệ số an toàn 2 lần)</text>
