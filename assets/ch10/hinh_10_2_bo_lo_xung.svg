<text x='24' y='184' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='700' fill='#2E7D4F' text-anchor='start'>Xung DÀI</text>
<text x='24' y='200' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>dài hơn 1 vòng quét</text>
