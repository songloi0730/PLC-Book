<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 380' width='900' height='380'>
<rect width='900' height='380' fill='#FFFFFF'/>
<text x='24' y='34' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='16' font-weight='700' fill='#1A1D21' text-anchor='start'>Hình 10.2 — Vì sao xung ngắn hơn vòng quét biến mất hoàn toàn</text>
<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>PLC chỉ nhìn ngõ vào một lần mỗi vòng quét. Xung nằm lọt giữa hai lần nhìn thì PLC không hề biết nó đã xảy ra.</text>
<text x='24' y='114' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#565E66' text-anchor='start'>Thời điểm PLC</text>
<text x='24' y='130' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#565E66' text-anchor='start'>đọc ngõ vào</text>
