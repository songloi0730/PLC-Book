<text x='24' y='34' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='16' font-weight='700' fill='#1A1D21' text-anchor='start'>Hình 21.1 — Vạch đôi và vạch đơn: hai nét vẽ, hai nghĩa ngược nhau</text>
<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>Vẽ nhầm một nét là máy đứng im vĩnh viễn mà không báo gì. Đếm số vạch trước khi kết luận về luồng.</text>
