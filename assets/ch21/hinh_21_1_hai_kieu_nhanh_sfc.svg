<text x='504' y='382' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Nhánh còn lại không bao giờ được kích hoạt lần này.</text>
<rect x='24' y='426' width='852' height='42' rx='3' fill='#FBE9E7' stroke='#B03A2E' stroke-width='1.3'/>
<text x='38' y='452' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='700' fill='#7A2E24' text-anchor='start'>⚠⚠  Vẽ nhầm vạch ĐƠN thành vạch ĐÔI: trình tự sẽ CHỜ một nhánh không bao giờ chạy — máy đứng im vĩnh viễn, và không có báo động nào.</text>
