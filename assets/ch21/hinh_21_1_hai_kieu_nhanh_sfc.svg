<text x='58' y='382' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#1E5B37' text-anchor='start'>Bước sau chỉ bắt đầu khi nhánh CHẬM NHẤT đã xong.</text>
