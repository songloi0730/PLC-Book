<line x1='300' y1='214' x2='300' y2='330' stroke='#9AA3AB' stroke-width='1.1' stroke-dasharray='3,3'/>
<line x1='668' y1='296' x2='668' y2='330' stroke='#9AA3AB' stroke-width='1.1' stroke-dasharray='3,3'/>
<line x1='300' y1='330' x2='658' y2='330' stroke='#565E66' stroke-width='1.6'/>
<polygon points='668.0,330.0 658.0,335.0 658.0,325.0' fill='#565E66'/>
<line x1='668' y1='330' x2='310' y2='330' stroke='#565E66' stroke-width='1.6'/>
<polygon points='300.0,330.0 310.0,325.0 310.0,335.0' fill='#565E66'/>
<text x='484' y='322' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='700' fill='#1A1D21' text-anchor='middle'>toàn vòng ~55–59 ms  (số đo trên một hệ thật)</text>
<rect x='24' y='352' width='418' height='76' rx='3' fill='#FBE9E7' stroke='#B03A2E' stroke-width='1.2'/>
<text x='38' y='372' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='700' fill='#B03A2E' text-anchor='start'>⚠⚠  Nếu bit CHO PHÉP chưa bật:</text>
<text x='38' y='390' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#7A2E24' text-anchor='start'>camera bỏ qua mọi lệnh kích — và KHÔNG báo lỗi gì.</text>
<text x='38' y='408' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#7A2E24' text-anchor='start'>Triệu chứng: dây đúng, địa chỉ đúng, mà không có ảnh nào.</text>
<rect x='456' y='352' width='418' height='76' rx='3' fill='#FDF6E7' stroke='#B8860B' stroke-width='1.2'/>
<text x='470' y='372' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='700' fill='#7A5B08' text-anchor='start'>⚠  Nếu xử lý chậm hơn nhịp máy:</text>
<text x='470' y='390' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#7A5B08' text-anchor='start'>gói về có thể là kết quả của SẢN PHẨM TRƯỚC.</text>
<text x='470' y='408' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#7A5B08' text-anchor='start'>Số thứ tự không khớp → VỨT BỎ, không dùng.</text>
</svg>