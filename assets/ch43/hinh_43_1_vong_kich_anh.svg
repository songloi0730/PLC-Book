<line x1='326' y1='140' x2='326' y2='152' stroke='#C0392B' stroke-width='2.4'/>
<line x1='326' y1='152' x2='866' y2='152' stroke='#9AA3AB' stroke-width='1.6'/>
<text x='296' y='132' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='700' fill='#C0392B' text-anchor='start'>cạnh lên</text>
<rect x='300' y='186' width='260' height='28' rx='3' fill='#EAF1F6' stroke='#1A1D21' stroke-width='1.4'/>
<text x='430' y='204' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='700' fill='#1A1D21' text-anchor='middle'>phơi sáng  →  xử lý ảnh</text>
<rect x='560' y='234' width='76' height='28' rx='3' fill='#DFF0E4' stroke='#2E7D4F' stroke-width='1.4'/>
<text x='598' y='252' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='700' fill='#1A1D21' text-anchor='middle'>gói kết quả</text>
<text x='644' y='246' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='700' fill='#2E7D4F' text-anchor='start'>kèm SỐ THỨ TỰ</text>
<line x1='168' y1='296' x2='668' y2='296' stroke='#9AA3AB' stroke-width='1.6'/>
<line x1='668' y1='296' x2='668' y2='284' stroke='#2E7D4F' stroke-width='2.4'/>
<line x1='668' y1='284' x2='866' y2='284' stroke='#2E7D4F' stroke-width='2.4'/>
