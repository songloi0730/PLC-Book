<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 452' width='900' height='452'>
<rect width='900' height='452' fill='#FFFFFF'/>
<text x='24' y='34' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='16' font-weight='700' fill='#1A1D21' text-anchor='start'>Hình 43.1 — Một vòng kích ảnh, từ lệnh tới lúc PLC dám dùng kết quả</text>
<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>Ba việc phải đúng: bit CHO PHÉP đã bật · kích theo CẠNH LÊN · kết quả mang ĐÚNG số thứ tự.</text>
<text x='24' y='108' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#565E66' text-anchor='start'>PLC — cho phép kích</text>
<line x1='168' y1='104' x2='866' y2='104' stroke='#9AA3AB' stroke-width='1.1' stroke-dasharray='3,3'/>
<text x='24' y='156' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#565E66' text-anchor='start'>PLC — lệnh kích</text>
<line x1='168' y1='152' x2='866' y2='152' stroke='#9AA3AB' stroke-width='1.1' stroke-dasharray='3,3'/>
<text x='24' y='204' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#565E66' text-anchor='start'>Camera — chụp &amp; xử lý</text>
<line x1='168' y1='200' x2='866' y2='200' stroke='#9AA3AB' stroke-width='1.1' stroke-dasharray='3,3'/>
<text x='24' y='252' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#565E66' text-anchor='start'>Mạng — kết quả về</text>
<line x1='168' y1='248' x2='866' y2='248' stroke='#9AA3AB' stroke-width='1.1' stroke-dasharray='3,3'/>
<text x='24' y='300' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#565E66' text-anchor='start'>PLC — dùng kết quả</text>
<line x1='168' y1='296' x2='866' y2='296' stroke='#9AA3AB' stroke-width='1.1' stroke-dasharray='3,3'/>
<line x1='168' y1='104' x2='214' y2='104' stroke='#9AA3AB' stroke-width='1.6'/>
<line x1='214' y1='104' x2='214' y2='92' stroke='#2E7D4F' stroke-width='2'/>
<line x1='214' y1='92' x2='866' y2='92' stroke='#2E7D4F' stroke-width='2.4'/>
<text x='220' y='86' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10' font-weight='700' fill='#2E7D4F' text-anchor='start'>bật TRƯỚC — và giữ nguyên</text>
<line x1='168' y1='152' x2='300' y2='152' stroke='#9AA3AB' stroke-width='1.6'/>
<line x1='300' y1='152' x2='300' y2='140' stroke='#C0392B' stroke-width='2.4'/>
