<text x='671' y='332' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Cảm biến KÉO dây tín hiệu xuống 0 V</text>
<rect x='488' y='346' width='366' height='58' rx='3' fill='#FDF6E7' stroke='#9AA3AB' stroke-width='1'/>
<text x='500' y='366' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#1A1D21' text-anchor='start'>⭐ Module phải CẤP dòng ra → gọi là ngõ vào source.</text>
<text x='500' y='386' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Nên nó ghép với cảm biến NPN.</text>
<rect x='24' y='438' width='852' height='72' rx='3' fill='#FBE9E7' stroke='#B03A2E' stroke-width='1.3'/>
<text x='38' y='462' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='700' fill='#7A2E24' text-anchor='start'>⚠⚠  Phần lớn module đời mới là loại CHUYỂN ĐƯỢC: cùng một module, đấu chân chung vào 0 V thì thành sink, vào +24 V thì thành source.</text>
<text x='38' y='482' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#1A1D21' text-anchor='start'>⭐ Nghĩa là KHÔNG nhìn ra kiểu đấu từ hình dáng module — chỉ nhìn ra từ sợi dây chân chung. Ghi rõ kiểu đã chọn lên bản vẽ và lên nhãn</text>
<text x='38' y='500' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#1A1D21' text-anchor='start'>trong tủ; người sửa máy hai năm sau không đoán ra được.</text>
</svg>