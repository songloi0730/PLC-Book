<text x='229' y='332' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#1A1D21' text-anchor='middle'>Cảm biến ĐẨY +24 V ra dây tín hiệu</text>
