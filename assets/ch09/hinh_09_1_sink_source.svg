<text x='671' y='116' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='400' fill='#565E66' text-anchor='middle'>chân chung nối +24 V  ·  ghép cảm biến NPN</text>
