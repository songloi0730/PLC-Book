<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 530' width='900' height='530'>
<rect width='900' height='530' fill='#FFFFFF'/>
<text x='24' y='34' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='16' font-weight='700' fill='#1A1D21' text-anchor='start'>Hình 9.1 — Ngõ vào kiểu sink và kiểu source</text>
<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>Hai kiểu khác nhau đúng một chỗ: chân chung nối 0 V hay nối +24 V. Từ đó suy ra chiều dòng, rồi suy ra phải ghép cảm biến loại nào.</text>
<text x='24' y='76' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Nét đỏ đậm = vòng dòng tín hiệu, khép kín từ +24 V về 0 V   ·   Nét xám mảnh = chân nguồn còn lại của cảm biến</text>
<rect x='24' y='88' width='410' height='336' rx='3' fill='#FFFFFF' stroke='#9AA3AB' stroke-width='1.2'/>
<rect x='24' y='88' width='410' height='34' rx='3' fill='#DFF0E4' stroke='#2E7D4F' stroke-width='1.3'/>
<text x='229' y='103' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='700' fill='#2E7D4F' text-anchor='middle'>A · Ngõ vào kiểu SINK</text>
<text x='229' y='116' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='400' fill='#565E66' text-anchor='middle'>chân chung nối 0 V  ·  ghép cảm biến PNP</text>
