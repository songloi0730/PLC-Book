<text x='24' y='34' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='16' font-weight='700' fill='#1A1D21' text-anchor='start'>Hình 36.1 — Ba tháng trôi dạt, và vì sao không ai thấy</text>
<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>Cùng một cỗ máy, cùng một quãng thời gian. Ba đại lượng dưới đây đều CÓ SẴN trong biến tần; PLC chỉ nhìn được đường trên cùng.</text>
