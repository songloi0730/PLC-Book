<text x='512' y='384' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='700' fill='#B03A2E' text-anchor='middle'>⚠ Triệu chứng duy nhất mà nhà máy nhìn thấy: chu kỳ máy dài thêm khoảng 8 %</text>
<rect x='24' y='404' width='852' height='82' rx='3' fill='#FDF6E7' stroke='#B8860B' stroke-width='1.3'/>
<text x='38' y='428' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='700' fill='#7A5B08' text-anchor='start'>⭐⭐ Không có gì hỏng, và không có báo động nào nổ. Biến tần đang làm ĐÚNG việc của nó: giảm tốc để khỏi quá dòng.</text>
<text x='38' y='450' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#1A1D21' text-anchor='start'>⭐ Ba đường dưới cùng nằm sẵn trong biến tần suốt ba tháng. Thứ thiếu không phải phép đo — mà là ĐƯỜNG ĐỌC VỀ.</text>
<text x='38' y='470' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#1A1D21' text-anchor='start'>⚡ Và đường "mốc" màu vàng là thứ phải ghi lại lúc nghiệm thu: không có mốc thì có đọc về cũng không biết đã trôi bao nhiêu.</text>
