<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>Ba sơ đồ trông na ná nhau. Khác biệt duy nhất là nguồn 24 V nằm ở đâu — và nó quyết định module sống hay chết.</text>
