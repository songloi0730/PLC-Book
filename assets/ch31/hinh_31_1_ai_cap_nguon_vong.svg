<text x='510' y='463' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#1A1D21' text-anchor='start'>khác nhau ở đúng điểm này.</text>
<rect x='24' y='512' width='852' height='42' rx='3' fill='#EAF1F6' stroke='#565E66' stroke-width='1.2'/>
<text x='38' y='531' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='700' fill='#1A1D21' text-anchor='start'>⭐ Hai lỗi cho hai triệu chứng KHÁC NHAU — đọc triệu chứng là biết đấu sai kiểu nào:</text>
<text x='38' y='547' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Đọc 0 mA suốt → có thể KHÔNG nguồn nào (ít hại, chỉ tốn công tìm).    Đọc vọt quá 20 mA, hoặc module chết → HAI nguồn.</text>
