<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 646' width='900' height='646'>
<rect width='900' height='646' fill='#FFFFFF'/>
<text x='24' y='34' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='16' font-weight='700' fill='#1A1D21' text-anchor='start'>Hình 33.1 — RTD đấu 2, 3 và 4 dây: dòng đi đường nào</text>
<text x='24' y='56' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='12' font-weight='400' fill='#565E66' text-anchor='start'>Ba cách trông giống nhau trên bản vẽ. Khác biệt duy nhất, và là khác biệt quyết định: sợi nào mang dòng kích thích, và điện áp được đo ở đâu.</text>
<text x='24' y='76' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='400' fill='#565E66' text-anchor='start'>Nét đỏ = sợi mang dòng kích thích   ·   Nét xanh = sợi chỉ để ĐO   ·   ô  R  = điện trở của chính sợi dây</text>
<rect x='16' y='88' width='868' height='142' rx='3' fill='#FFFFFF' stroke='#9AA3AB' stroke-width='1.1'/>
