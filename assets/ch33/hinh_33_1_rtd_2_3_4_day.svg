<text x='499' y='368' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9' font-weight='700' fill='#B8860B' text-anchor='middle'>⚠ Giả định: ba sợi cùng loại, cùng chiều dài, đi cùng một cáp</text>
