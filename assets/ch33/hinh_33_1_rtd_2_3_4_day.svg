<text x='499' y='218' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9' font-weight='700' fill='#B03A2E' text-anchor='middle'>⚠ Module chỉ đo được tại chân của chính nó — dây nằm trong kết quả</text>
<text x='734' y='152' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='700' fill='#1A1D21' text-anchor='start'>Module đo:</text>
