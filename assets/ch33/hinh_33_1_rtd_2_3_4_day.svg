<text x='734' y='452' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='700' fill='#1A1D21' text-anchor='start'>Sợi đo không có dòng</text>
<text x='734' y='468' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='9.5' font-weight='400' fill='#565E66' text-anchor='start'>→ không có sụt áp</text>
<rect x='16' y='546' width='868' height='88' rx='3' fill='#FDF6E7' stroke='#B8860B' stroke-width='1.3'/>
<text x='32' y='570' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='700' fill='#7A5B08' text-anchor='start'>⭐⭐ Vì sao 3 dây là mặc định của ngành: nó bù được gần hết sai số với chi phí thêm ĐÚNG MỘT SỢI DÂY.</text>
<text x='32' y='592' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#1A1D21' text-anchor='start'>⚡ Bước từ 2 lên 3 dây cải thiện rất nhiều; bước từ 3 lên 4 dây cải thiện thêm rất ít trong điều kiện máy công nghiệp.</text>
<text x='32' y='612' font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='400' fill='#1A1D21' text-anchor='start'>⚠ Và nhớ giả định của cách 3 dây: nối thêm một đoạn dây khác loại vào MỘT sợi là phá giả định đó — sai số quay lại mà không báo gì.</text>
